version: '3.9'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: forest_postgis
    restart: always
    environment:
      POSTGRES_DB: forest_db
      POSTGRES_USER: forest_user
      POSTGRES_PASSWORD: forest_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
